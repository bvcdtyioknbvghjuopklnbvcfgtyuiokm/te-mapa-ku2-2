<script>
(() => {
  const palettes = [
    ["#141530", "#7650a0", "#ffc4e8"],
    ["#102b43", "#457ca1", "#a3efff"],
    ["#312038", "#a46c72", "#ffddb1"]
  ];

  function illustration(kind, index) {
    const [dark, mid, light] = palettes[index % palettes.length];
    const gradientId = "scene-gradient-" + index;
    const glowId = "scene-glow-" + index;

    let scene = "";

    const stars = Array.from({ length: 55 }, (_, i) => {
      const x = (i * 173 + 43) % 1000;
      const y = (i * 79 + 21) % 390;
      return `<circle cx="${x}" cy="${y}" r="${i % 4 === 0 ? 2.5 : 1.2}"
        fill="${light}" opacity="${0.35 + (i % 5) * 0.12}"/>`;
    }).join("");

    function buildings() {
      return Array.from({ length: 11 }, (_, i) => {
        const x = i * 100 - 35;
        const height = 130 + (i * 47) % 180;
        const y = 530 - height;
        const windows = Array.from({ length: 8 }, (_, j) => {
          return `<rect x="${x + 20 + (j % 2) * 32}"
            y="${y + 30 + Math.floor(j / 2) * 35}"
            width="13" height="19" rx="3"
            fill="${light}" opacity="${j % 3 === 0 ? ".85" : ".35"}"/>`;
        }).join("");
        return `<rect x="${x}" y="${y}" width="87"
          height="${height}" rx="4" fill="${i % 2 ? "#22233f" : "#191c35"}"/>
          <path d="M${x - 7} ${y} L${x + 43} ${y - 45}
          L${x + 94} ${y} Z" fill="${mid}"/>${windows}`;
      }).join("");
    }

    if (kind === "cafe") {
      scene = `
        <rect x="90" y="100" width="820" height="370" rx="15" fill="#231f33"/>
        <path d="M140 355 V230 A100 100 0 0 1 200 145
          A100 100 0 0 1 260 230 V355Z" fill="${mid}"/>
        <path d="M740 355 V230 A100 100 0 0 1 800 145
          A100 100 0 0 1 860 230 V355Z" fill="${mid}"/>
        <path d="M200 150 V355 M140 270 H260 M800 150 V355 M740 270 H860"
          stroke="${light}" stroke-width="4" opacity=".5"/>
        <rect x="340" y="160" width="320" height="90" rx="12"
          fill="${dark}" stroke="${light}" stroke-opacity=".5"/>
        <text x="500" y="215" text-anchor="middle" fill="${light}"
          font-family="sans-serif" font-size="27" letter-spacing="6">GUILD CAFE</text>
        <path d="M350 0 V100 M650 0 V100" stroke="${light}" stroke-width="3"/>
        <path d="M305 135 L350 95 L395 135Z M605 135 L650 95 L695 135Z"
          fill="${light}"/>
        <ellipse cx="500" cy="425" rx="235" ry="35" fill="#8a637e"/>
        <path d="M330 445 L310 570 M670 445 L690 570"
          stroke="#79556c" stroke-width="16"/>
        <rect x="440" y="350" width="85" height="65" rx="12" fill="${light}"/>
        <path d="M525 362 C568 355 568 405 525 400"
          fill="none" stroke="${light}" stroke-width="10"/>
        <path d="M465 330 Q445 310 465 285 M495 330 Q475 310 495 285"
          stroke="#ffffff80" stroke-width="4" fill="none"/>
        <ellipse cx="615" cy="395" rx="48" ry="17" fill="#f4d5bc"/>
        <path d="M575 389 Q610 330 650 389" fill="#cb919b"/>`;
    } else if (kind === "craft") {
      scene = `
        <rect x="120" y="95" width="760" height="285" rx="16"
          fill="#26243d" stroke="${light}" stroke-opacity=".25"/>
        <text x="500" y="155" text-anchor="middle" fill="${light}"
          font-family="sans-serif" font-size="23" letter-spacing="5">CUSTOMIZE YOUR LOVE</text>
        ${Array.from({ length: 8 }, (_, i) => {
          const colors = ["#ffa3d4", "#99eaff", "#bda6ff", "#ffe095"];
          return `<path d="M${205 + i * 82} 200 V310"
            stroke="${colors[i % 4]}" stroke-width="19"/>
            <circle cx="${205 + i * 82}" cy="220" r="18"
              fill="${colors[i % 4]}"/>`;
        }).join("")}
        <path d="M70 400 H930 L980 475 H20Z" fill="#87637f"/>
        <path d="M90 475 V600 M910 475 V600"
          stroke="#513953" stroke-width="25"/>
        <rect x="375" y="290" width="190" height="155" rx="20"
          fill="${mid}" stroke="${light}" stroke-width="5"/>
        <path d="M420 290 V265 Q470 200 520 265 V290"
          fill="none" stroke="${light}" stroke-width="8"/>
        <path d="M470 322 L480 349 L510 350 L487 368
          L495 396 L470 380 L445 396 L453 368 L430 350 L460 349Z"
          fill="${light}"/>
        <circle cx="680" cy="425" r="25" fill="#aee8ff"/>
        <circle cx="745" cy="430" r="25" fill="#ffd19b"/>
        <path d="M230 410 L290 450 M290 410 L230 450"
          stroke="#e1d5ed" stroke-width="7"/>
        <circle cx="222" cy="405" r="12" fill="none"
          stroke="#e1d5ed" stroke-width="5"/>
        <circle cx="299" cy="405" r="12" fill="none"
          stroke="#e1d5ed" stroke-width="5"/>`;
    } else if (kind === "mountain") {
      scene = `
        <circle cx="750" cy="140" r="65" fill="${light}" opacity=".8"/>
        <path d="M0 470 L220 150 L400 390 L580 110 L850 430 L1000 240 V600 H0Z"
          fill="${mid}" opacity=".6"/>
        <path d="M420 300 L580 110 L730 290 L625 245 L580 175 L535 250Z"
          fill="#e5ddf7" opacity=".6"/>
        <path d="M0 530 L220 350 L420 500 L700 330 L1000 500 V600 H0Z"
          fill="#25223f"/>
        <path d="M460 600 Q550 470 535 390 Q520 350 570 330"
          fill="none" stroke="${light}" stroke-width="10" opacity=".6"/>
        <path d="M535 365 V310 H585 V365 M548 310 V280 L560 260 L575 280 V310"
          fill="#15192d" stroke="${light}" stroke-width="2"/>`;
    } else if (kind === "city") {
      scene = `
        <circle cx="760" cy="125" r="62" fill="${light}" opacity=".85"/>
        ${buildings()}
        <path d="M350 600 L470 420 H530 L660 600Z" fill="${mid}" opacity=".5"/>
        <path d="M485 600 L500 460 L515 600Z" fill="${light}" opacity=".3"/>
        <path d="M100 180 Q500 320 900 180" fill="none"
          stroke="${light}" stroke-width="2" opacity=".5"/>
        ${Array.from({ length: 9 }, (_, i) =>
          `<circle cx="${140 + i * 90}" cy="${200 + 55 * Math.sin(i / 8 * Math.PI)}"
            r="6" fill="${light}"/>`
        ).join("")}`;
    } else if (kind === "event") {
      scene = `
        <path d="M160 0 L430 460 L80 460Z" fill="#a897ff" opacity=".14"/>
        <path d="M840 0 L920 460 L570 460Z" fill="#ffa9df" opacity=".18"/>
        <rect x="180" y="205" width="640" height="260" rx="20"
          fill="#25213c" stroke="${light}" stroke-opacity=".35"/>
        <text x="500" y="280" text-anchor="middle" fill="${light}"
          font-family="sans-serif" font-size="30" letter-spacing="7">OSHI COLOR NIGHT</text>
        <path d="M500 310 L514 344 L550 348 L523 371
          L532 407 L500 388 L468 407 L477 371 L450 348 L486 344Z"
          fill="${light}"/>
        <ellipse cx="500" cy="465" rx="360" ry="35" fill="${mid}"/>
        ${Array.from({ length: 15 }, (_, i) => `
          <circle cx="${35 + i * 67}" cy="${530 + i % 3 * 12}" r="18" fill="#121427"/>
          <rect x="${15 + i * 67}" y="${545 + i % 3 * 12}"
            width="40" height="70" rx="15" fill="#121427"/>
          <path d="M${45 + i * 67} 530 L${55 + i * 67} 490"
            stroke="${i % 2 ? "#ffa9df" : "#99eaff"}" stroke-width="5"/>`
        ).join("")}`;
    } else {
      scene = `
        <circle cx="745" cy="155" r="72" fill="${light}" opacity=".85"/>
        <circle cx="720" cy="130" r="66" fill="${dark}"/>
        <path d="M0 480 Q220 330 440 470 T1000 400 V600 H0Z"
          fill="${mid}" opacity=".3"/>
        ${buildings()}
        <path d="M500 90 L511 123 L545 135 L511 147 L500 180
          L489 147 L455 135 L489 123Z" fill="${light}"/>
        <ellipse cx="500" cy="570" rx="350" ry="30"
          fill="${light}" opacity=".08"/>`;
    }

    return `<svg xmlns="http://www.w3.org/2000/svg" width="1000"
      height="600" viewBox="0 0 1000 600">
      <defs>
        <linearGradient id="${gradientId}" x2="1" y2="1">
          <stop stop-color="${dark}"/>
          <stop offset="1" stop-color="${mid}"/>
        </linearGradient>
        <radialGradient id="${glowId}">
          <stop stop-color="${light}" stop-opacity=".25"/>
          <stop offset="1" stop-color="${light}" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="1000" height="600" fill="url(#${gradientId})"/>
      <ellipse cx="700" cy="200" rx="400" ry="300" fill="url(#${glowId})"/>
      ${stars}${scene}
      <rect width="1000" height="600" fill="none"
        stroke="${light}" stroke-opacity=".08" stroke-width="20"/>
    </svg>`;
  }

  document.querySelectorAll("img").forEach((image, index) => {
    const description = image.alt || "";
    let kind = "stars";

    if (/工房|ものづくり|作業/.test(description)) kind = "craft";
    else if (/カフェ|コーヒー|食堂|レストラン/.test(description)) kind = "cafe";
    else if (/山|冒険世界/.test(description)) kind = "mountain";
    else if (/交流|会場/.test(description)) kind = "event";
    else if (/街|城|入口/.test(description)) kind = "city";

    image.removeAttribute("srcset");
    image.removeAttribute("sizes");
    image.src = "data:image/svg+xml;charset=utf-8,"
      + encodeURIComponent(illustration(kind, index));
    image.alt = description + "（オリジナルイラスト）";
  });

  document.querySelectorAll(".muted, footer p, .demo-banner").forEach(element => {
    if (element.textContent.includes("Unsplash")) {
      element.textContent =
        "本サイトは架空の企画です。施設・作品・商品・料金・交通・イベントは実在しません。画像は世界観を表現したオリジナルイラストです。";
    } else if (element.textContent.includes("写真はイメージ")) {
      element.textContent =
        "架空のテーマパークのコンセプトサイトです。画像はイラスト／予約・購入はできません。";
    } else if (element.textContent.includes("実際の施設写真ではありません")) {
      element.textContent =
        "世界観を楽しむためのオリジナルイラストギャラリー。実際の施設を示すものではありません。";
    }
  });
})();
</script>
